<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Half a Doodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Shantell+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Scrappy school-project look: clipboard, ruled paper, tape and pins.
     Nothing that wraps the canvas is ever rotated -- pointerdown maps the cursor
     through pad.getBoundingClientRect(), and a rotated ancestor would return the
     axis-aligned box of a tilted element and skew every stroke. Decoration only
     tilts things the canvas does not live inside. */
  :root {
    --ink: #202b38; --paper: #fefcf5; --rule: #d6e5f3;
    --margin: #e8827e; --pencil: #636c7a; --stamp: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1rem; display: flex; justify-content: center;
    color: var(--ink);
    font-family: 'Patrick Hand', "Segoe Print", "Bradley Hand", cursive, sans-serif;
    font-size: 1.05rem;
    background-color: #56442f;
    background-image: repeating-linear-gradient(91deg, rgba(0,0,0,.12) 0 2px, transparent 2px 52px),
                      linear-gradient(160deg, #6d5740, #43351f);
  }
  .clipboard {
    position: relative; width: 100%; max-width: 900px;
    padding: 34px 22px 24px; border-radius: 14px;
    background: linear-gradient(#c99b64, #ad7f4a);
    box-shadow: 0 20px 38px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.14);
  }
  .clip {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 34px; border-radius: 7px;
    background: linear-gradient(165deg, #57514a 0%, #2a2622 52%, #3e3833 100%);
    box-shadow: 0 4px 7px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,238,210,.35),
                inset 0 -7px 10px rgba(0,0,0,.4);
    z-index: 4;
  }
  .clip::after {
    content: ""; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    width: 64px; height: 15px; border-radius: 0 0 9px 9px;
    background: linear-gradient(165deg, #3e3833, #201d1a);
  }
  .paper {
    position: relative; min-height: 560px; padding: 32px 32px 34px 62px;
    background-color: var(--paper);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 28px; background-position: 0 66px;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 0 6px 18px rgba(0,0,0,.32);
  }
  .paper::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 46px;
    border-left: 2px solid var(--margin); opacity: .8;
  }
  /* Notebook binder punch holes on left margin */
  .hole {
    position: absolute; left: 16px; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #805930, #4e3519);
    box-shadow: inset 0 1.5px 3px rgba(0,0,0,0.65), 0 1px 0 rgba(255,255,255,0.7);
    pointer-events: none; z-index: 2;
  }
  .hole-1 { top: 70px; }
  .hole-2 { top: 50%; transform: translateY(-50%); }
  .hole-3 { bottom: 70px; }
  .pin {
    position: absolute; top: 12px; width: 19px; height: 19px; border-radius: 50%;
    pointer-events: none; z-index: 3; box-shadow: 0 3px 6px rgba(0,0,0,.45);
    background: radial-gradient(circle at 33% 30%, #ff9a8f, #c62828 62%, #7f1d1a);
  }
  .pin::after {
    content: ""; position: absolute; top: 4px; right: 5px;
    width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.75);
  }
  .pin-a { left: 24px; }
  .pin-b { right: 24px; background: radial-gradient(circle at 33% 30%, #9fd0f7, #1565c0 62%, #0c3a72); }
  /* Science fair / teacher red stamp */
  .stamp {
    position: absolute; top: 16px; right: 48px;
    border: 3px double var(--stamp); color: var(--stamp);
    padding: 2px 10px; font-family: 'Kalam', cursive;
    font-size: 1.15rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; border-radius: 8px 14px 6px 12px;
    transform: rotate(8deg); opacity: 0.85; pointer-events: none; user-select: none;
    box-shadow: 0 0 0 1px rgba(198,40,40,0.12);
  }
  h1 {
    font-family: 'Kalam', cursive;
    margin: 0 0 2px; font-size: 1.95rem; font-weight: 700;
    transform: rotate(-1deg); transform-origin: left center;
  }
  h1 em {
    display: block; margin-top: 2px; font-style: normal;
    font-family: 'Patrick Hand', cursive;
    font-size: 0.98rem; color: var(--pencil); transform: rotate(.4deg);
  }
  #wrap { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; margin-top: 24px; }
  .tapewrap { position: relative; }
  canvas {
    display: block; background: #fdfbf7;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 2px 4px 14px rgba(0,0,0,.18); touch-action: none; cursor: crosshair;
  }
  canvas.busy { cursor: wait; opacity: .5; }
  .tape {
    position: absolute; width: 94px; height: 28px; z-index: 2; pointer-events: none;
    background: rgba(255,243,170,.82); box-shadow: 0 1px 3px rgba(0,0,0,.15);
    clip-path: polygon(
      0% 0%, 94% 0%, 100% 15%, 95% 32%, 100% 50%, 96% 68%, 100% 84%, 94% 100%,
      0% 100%, 5% 82%, 0% 65%, 4% 48%, 0% 30%, 5% 14%
    );
    backdrop-filter: blur(0.5px);
  }
  .tape-tl { top: -14px; left: -18px; transform: rotate(-24deg); }
  .tape-br { bottom: -14px; right: -18px; transform: rotate(-24deg); }
  #side { min-width: 260px; flex: 1; }
  .heading {
    margin: 0 0 12px; font-family: 'Kalam', cursive;
    font-size: 1.35rem; font-weight: 700;
    text-decoration: underline wavy var(--margin);
  }
  .row { margin-bottom: 12px; }
  .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Caveat', cursive; font-size: 1.45rem; font-weight: 700;
    margin-bottom: 2px; line-height: 1.1;
  }
  .lab .rank {
    display: inline-block; font-size: 1rem; color: var(--pencil);
    margin-right: 4px; font-family: 'Patrick Hand', cursive;
  }
  .bar {
    height: 16px; position: relative; border-radius: 4px;
    background: rgba(0,0,0,.03); overflow: hidden;
  }
  .fill {
    height: 100%; width: 0; transition: width .15s cubic-bezier(0.2, 0.8, 0.25, 1);
    background: rgba(255, 222, 89, 0.78);
    border-radius: 2px 6px 3px 5px;
    transform: skewX(-4deg);
    mix-blend-mode: multiply;
  }
  .row:first-child .fill { background: rgba(105, 235, 155, 0.82); }
  /* empty state, CSS-only so the JS stays untouched */
  #guesses:empty::before {
    content: "\270E doodle something to guess\2026";
    font-family: 'Patrick Hand', cursive;
    color: var(--pencil); font-size: 1.2rem;
    display: block; padding-top: 6px;
  }
  /* Eraser-styled Clear button */
  #clear {
    position: relative; margin-top: 10px;
    font-family: 'Kalam', cursive; font-size: 1.05rem; font-weight: 700;
    padding: 7px 24px; cursor: pointer;
    color: #45161c; background: #ff9da7;
    border: 2.5px solid #45161c;
    border-radius: 4px 18px 4px 18px / 18px 4px 18px 4px;
    transform: rotate(-2deg);
    box-shadow: 3px 3px 0 #45161c;
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  }
  #clear:hover {
    transform: rotate(0deg) scale(1.04);
    background: #ffadb6;
  }
  #clear:active {
    transform: rotate(-2deg) translate(2px, 2px);
    box-shadow: 1px 1px 0 #45161c;
  }
  #status {
    margin: 14px 0 0; font-family: 'Patrick Hand', cursive;
    font-size: 0.95rem; color: var(--pencil);
  }
  /* --- live captioner: a sticky note the vision model talks through --- */
  .note {
    position: relative; margin-top: 24px; padding: 22px 16px 14px;
    background: linear-gradient(158deg, #fffbb8, #ffe873);
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 2px 3px 18px 2px / 2px 18px 3px 2px;
    box-shadow: 2px 6px 15px rgba(0,0,0,.22); transform: rotate(1.2deg);
  }
  .note::after {
    content: ""; position: absolute; right: 0; bottom: 0; border: 10px solid transparent;
    border-right-color: rgba(0,0,0,.15); border-bottom-color: rgba(0,0,0,.15);
  }
  .tape-note {
    top: -13px; left: 50%; margin-left: -44px; transform: rotate(1.8deg);
  }
  .notehead {
    margin: 0 0 8px; font-family: 'Patrick Hand', cursive;
    font-size: 0.9rem; color: #786624;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  /* hand-drawn looking on/off switch */
  .sw { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .sw input {
    appearance: none; -webkit-appearance: none; margin: 0; position: relative;
    width: 34px; height: 18px; border: 2px solid var(--ink); border-radius: 10px;
    background: #fff7d4; cursor: pointer; transition: background .15s;
  }
  .sw input::after {
    content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--ink); transition: left .15s;
  }
  .sw input:checked { background: #b5f5ce; }
  .sw input:checked::after { left: 17px; }
  .sw input:disabled { opacity: .4; cursor: not-allowed; }
  .sw input:disabled + span { opacity: .5; }
  #caption {
    margin: 0; font-family: 'Shantell Sans', 'Patrick Hand', cursive, sans-serif;
    font-size: 1.05rem; font-weight: 600; line-height: 1.4;
    color: #3b300c; min-height: 2.6em;
  }
  #caption.muted { color: #877432; font-size: 0.98rem; font-weight: 500; }
  .cur { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  #vlm {
    margin-top: 9px; font-family: 'Patrick Hand', cursive; font-size: 0.85rem; color: #6b5c25;
    background: rgba(255,255,255,.6); border: 1.5px solid rgba(0,0,0,.22);
    border-radius: 4px; padding: 2px 4px;
  }
  #vlm[hidden] { display: none; }
  /* Word Bank index card */
  .wordbank {
    margin-top: 24px; padding: 12px 18px 14px;
    background: #ffffff;
    border: 2px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 2px 4px 10px rgba(0,0,0,.08);
    position: relative;
  }
  .wordbank-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 0 8px; font-family: 'Kalam', cursive; font-size: 1.1rem;
    font-weight: 700; color: var(--ink);
  }
  .wordbank-head span:last-child {
    font-family: 'Patrick Hand', cursive; font-size: 0.88rem; color: var(--pencil);
    font-weight: normal;
  }
  .wordbank-tags {
    display: flex; flex-wrap: wrap; gap: 6px 7px;
  }
  .wordbank-tags span {
    display: inline-block;
    font-family: 'Shantell Sans', 'Patrick Hand', cursive, sans-serif;
    font-size: 0.92rem; font-weight: 600;
    color: #1e293b; background: #f4f6f8;
    padding: 3px 10px; border-radius: 6px;
    border: 1.5px dashed #cbd5e1;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
<div class="clipboard">
  <div class="clip"></div>
  <div class="paper">
    <div class="hole hole-1"></div>
    <div class="hole hole-2"></div>
    <div class="hole hole-3"></div>
    <span class="pin pin-a"></span>
    <span class="pin pin-b"></span>
    <div class="stamp">A+ Project</div>
    <h1>Half a Doodle<em>it guesses while you draw &mdash; 20 things, 28&times;28 pixels</em></h1>
    <div id="wrap">
      <div class="tapewrap">
        <span class="tape tape-tl"></span>
        <span class="tape tape-br"></span>
        <canvas id="pad" width="400" height="400" class="busy"></canvas>
      </div>
      <div id="side">
        <p class="heading">My guesses:</p>
        <div id="guesses"></div>
        <button id="clear">Clear</button>
        <p id="status">loading model&hellip;</p>
        <div class="note">
          <span class="tape tape-note"></span>
          <p class="notehead">
            <label class="sw"><input type="checkbox" id="vlmon" disabled><span>narrate</span></label>
            <span id="vlmwho"></span>
          </p>
          <p id="caption" class="muted">looking for Ollama&hellip;</p>
          <select id="vlm" hidden></select>
        </div>
      </div>
    </div>
    <div class="wordbank">
      <div class="wordbank-head">
        <span>Word Bank</span>
        <span>20 things it knows</span>
      </div>
      <div class="wordbank-tags">
        <span>airplane</span><span>apple</span><span>banana</span><span>bicycle</span><span>book</span>
        <span>butterfly</span><span>cat</span><span>chair</span><span>clock</span><span>cloud</span>
        <span>cup</span><span>eye</span><span>fish</span><span>flower</span><span>guitar</span>
        <span>house</span><span>key</span><span>moon</span><span>star</span><span>tree</span>
      </div>
    </div>
  </div>
</div>

// Hand port of rasterize() in data.py -- the two must stay identical. Rounding is
// floor(v + 0.5) everywhere (Python's round() is banker's, JS's is half-up) and the
// downsample is integer (sum + 32) / 64, so both agree byte for byte.
const CANVAS = 224, TARGET = 192, OUT = 28, BLOCK = 8;

function stamp(img, cx, cy, half, lw) {
  for (let dy = 0; dy < lw; dy++) {
    const yy = cy - half + dy;
    if (yy < 0 || yy >= CANVAS) continue;
    for (let dx = 0; dx < lw; dx++) {
      const xx = cx - half + dx;
      if (xx >= 0 && xx < CANVAS) img[yy * CANVAS + xx] = 255;
    }
  }
}

function rasterize(strokes, lineWidth) {
  lineWidth = lineWidth || 3;
  const out = new Uint8Array(OUT * OUT);
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity, n = 0;
  for (const s of strokes) {
    for (let i = 0; i < s[0].length; i++) {
      n++;
      if (s[0][i] < minx) minx = s[0][i];
      if (s[0][i] > maxx) maxx = s[0][i];
      if (s[1][i] < miny) miny = s[1][i];
      if (s[1][i] > maxy) maxy = s[1][i];
    }
  }
  if (n === 0) return out;
  const w = maxx - minx, h = maxy - miny;
  const scale = (w < 1 && h < 1) ? 1.0 : TARGET / Math.max(w, h);
  const ox = (CANVAS - w * scale) / 2.0 - minx * scale;
  const oy = (CANVAS - h * scale) / 2.0 - miny * scale;
  const img = new Uint8Array(CANVAS * CANVAS);
  const half = Math.floor(lineWidth / 2);
  for (const s of strokes) {
    const m = s[0].length;
    if (m === 0) continue;
    const xs = new Float64Array(m), ys = new Float64Array(m);
    for (let i = 0; i < m; i++) { xs[i] = s[0][i] * scale + ox; ys[i] = s[1][i] * scale + oy; }
    if (m === 1) { stamp(img, Math.floor(xs[0] + 0.5), Math.floor(ys[0] + 0.5), half, lineWidth); continue; }
    for (let i = 0; i < m - 1; i++) {
      const x0 = xs[i], y0 = ys[i];
      const dx = xs[i + 1] - x0, dy = ys[i + 1] - y0;
      let steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)));
      if (steps < 1) steps = 1;
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        stamp(img, Math.floor(x0 + dx * t + 0.5), Math.floor(y0 + dy * t + 0.5), half, lineWidth);
      }
    }
  }
  for (let by = 0; by < OUT; by++) {
    for (let bx = 0; bx < OUT; bx++) {
      let sum = 0;
      for (let y = 0; y < BLOCK; y++) {
        const row = (by * BLOCK + y) * CANVAS + bx * BLOCK;
        for (let x = 0; x < BLOCK; x++) sum += img[row + x];
      }
      out[by * OUT + bx] = Math.floor((sum + 32) / 64);
    }
  }
  return out;
}
// The JS port must reproduce Python's bytes exactly.
function parityCheck() {
  let allOk = true;
  for (const name of ["full", "partial", "dot"]) {
    const got = rasterize(PARITY[name].strokes), exp = PARITY[name].pixels;
    let diff = got.length === exp.length ? 0 : 999;
    for (let i = 0; i < got.length; i++) if (got[i] !== exp[i]) diff++;
    console.log("parity[" + name + "]: " + (diff === 0 ? "MATCH" : "MISMATCH (" + diff + " px)"));
    allOk = allOk && diff === 0;
  }
  console.log(allOk ? "PARITY OK - JS rasterizer is byte-identical to Python" : "PARITY FAILED - fix the port");
  window.__parity = allOk;
  return allOk;
}

const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
const guesses = document.getElementById("guesses"), status = document.getElementById("status");
let strokes = [], drawing = false, session = null, lastInfer = 0;
ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#202b38";
const pos = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
pad.addEventListener("pointerdown", e => {
  if (!session) return;
  const [x, y] = pos(e);
  strokes.push([[x], [y]]);
  drawing = true;
  pad.setPointerCapture(e.pointerId);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y); ctx.stroke();
});

pad.addEventListener("pointermove", e => {
  if (!drawing) return;
  const [x, y] = pos(e), s = strokes[strokes.length - 1];
  ctx.beginPath();
  ctx.moveTo(s[0][s[0].length - 1], s[1][s[1].length - 1]);
  ctx.lineTo(x, y); ctx.stroke();
  s[0].push(x); s[1].push(y);
  const now = performance.now();
  if (now - lastInfer > 200) { lastInfer = now; infer(); }   // not on every move
});
pad.addEventListener("pointerup", () => { if (drawing) { drawing = false; infer(); } });
document.getElementById("clear").addEventListener("click", () => {
  strokes = []; drawing = false;
  ctx.clearRect(0, 0, pad.width, pad.height);
  render([]);
});
function render(top) {
  nnTop = top;                               // the captioner reads this as a hint
  const ranks = ["\u2460", "\u2461", "\u2462"];
  guesses.innerHTML = top.map((t, i) => {
    const pct = (t[1] * 100).toFixed(1);
    const rank = ranks[i] || (i + 1);
    return '<div class="row"><div class="lab"><span><span class="rank">' + rank + '</span>' + t[0] + '</span><span>' + pct +
           '%</span></div><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }).join("");
}

// ORT Web allows only one run() at a time ("Session already started"), so keep a single
// inference in flight and re-run once afterwards if the drawing moved on.
let busy = false, pending = false;
async function infer() {
  if (!session || strokes.length === 0) { render([]); return; }
  if (busy) { pending = true; return; }
  busy = true;
  try {
    const px = rasterize(strokes);
    const data = new Float32Array(OUT * OUT);
    for (let i = 0; i < data.length; i++) data[i] = px[i];   // raw 0-255; /255 is inside the model
    const res = await session.run({ x: new ort.Tensor("float32", data, [1, 1, OUT, OUT]) });
    const logits = res.linear.data;
    let mx = -Infinity;
    for (let i = 0; i < logits.length; i++) if (logits[i] > mx) mx = logits[i];
    let sum = 0; const p = [];
    for (let i = 0; i < logits.length; i++) { p[i] = Math.exp(logits[i] - mx); sum += p[i]; }
    for (let i = 0; i < p.length; i++) p[i] /= sum;
    const order = p.map((v, i) => i).sort((a, b) => p[b] - p[a]).slice(0, 3);
    render(order.map(i => [CLASSES[i], p[i]]));
  } catch (err) {
    console.error(err);
  } finally {
    busy = false;
    if (pending) { pending = false; infer(); }
  }
}

const OLLAMA = "http://localhost:11434";
const CAPTION_MS = 800;      // gap after one caption finishes; ~2s inference puts
                             // the real cadence at roughly three seconds
const RETRY_MS = 15000;      // how often to look for Ollama again while it is missing
const PREFERRED = ["moondream", "llava"];   // first match wins; any vision model works
const REMEMBER = "halfadoodle.narrate";
// Keep this phrasing. moondream is 1.8B and is fussy: prompts that open with a
// statement and then ask work, while "What is this?", "In one short sentence ..."
// and anything ending "Answer briefly." all return an empty string or a row of
// exclamation marks. Reads fine on the larger models too.
const PROMPT = "This is an unfinished doodle. What does it look like so far?";
// Handing the classifier's guess to the vision model turns "two circles, one larger
// than the other" into "a bicycle, with two identical circles representing the
// wheels" -- it stops naming shapes and starts explaining the drawing. Only worth
// doing when the classifier is actually sure: a single stroke scores about 30%, and
// on a vague sketch the model narrates whatever it is told as fact. Measured, not
// assumed -- a wrong hint over a clear drawing is ignored, a wrong hint over an
// ambiguous one is believed.
const HINT_MIN = 0.6;
let nnTop = [];              // most recent [[label, prob], ...] from the classifier

const IDLE = "draw something and I'll tell you what I see";
const OFF = "narration off";

const caption = document.getElementById("caption");
const vlmOn = document.getElementById("vlmon");
const vlmPick = document.getElementById("vlm"), vlmWho = document.getElementById("vlmwho");

const forced = new URLSearchParams(location.search).get("vlm") || "";
let vlmState = "probing";                    // probing | absent | nomodel | ready
let vlmModel = "", capAbort = null, lastShot = "";

// localStorage throws in some sandboxed contexts, so never let it break the page
function remembered() { try { return localStorage.getItem(REMEMBER) !== "off"; } catch (e) { return true; } }
function remember(v) { try { localStorage.setItem(REMEMBER, v ? "on" : "off"); } catch (e) {} }
let narrate = remembered();                  // defaults on, a saved choice wins

const sleep = ms => new Promise(r => setTimeout(r, ms));
// cheap "has the drawing moved on since the last caption" check
const fingerprint = () => strokes.length + ":" + strokes.reduce((n, s) => n + s[0].length, 0);

function say(text, muted) { caption.className = muted ? "muted" : ""; caption.textContent = text; }
// model output is data, never markup: textContent plus an appended cursor node
function sayStreaming(text) {
  say(text, false);
  const cur = document.createElement("span");
  cur.className = "cur"; cur.textContent = "\u258c";
  caption.appendChild(cur);
}

// Replies invariably open with a clinical "The image features ...". Drop just that
// lead-in and keep the model's own words; unmatched text passes through untouched.
function tidy(s) {
  const t = s.trim()
    .replace(/^(the|this)\s+(image|picture|drawing|doodle|photo)\s+(features|shows|depicts|contains|is|appears to (be|show))\s+/i, "")
    .replace(/^(it\s+)?(looks like|appears to be)\s+/i, "");
  return t ? t[0].toUpperCase() + t.slice(1) : s.trim();
}

function setState(s, msg) {
  vlmState = s;
  const ready = s === "ready";
  vlmOn.disabled = !ready;                   // the switch is only usable once Ollama answers
  vlmOn.checked = ready && narrate;
  vlmWho.textContent = ready && vlmModel ? "via " + vlmModel : "";
  vlmPick.hidden = !(ready && vlmPick.options.length > 1);
  if (msg) say(msg, true);
}

// pad's own bitmap is transparent wherever nothing was drawn -- the white is CSS on
// the element, not pixels. A transparent PNG reaches the model as black on black,
// so flatten onto white first or it narrates an empty void every time.
function snapshot() {
  const shot = document.createElement("canvas");
  shot.width = pad.width; shot.height = pad.height;
  const s = shot.getContext("2d");
  s.fillStyle = "#fff"; s.fillRect(0, 0, shot.width, shot.height);
  s.drawImage(pad, 0, 0);
  return shot.toDataURL("image/png").split(",")[1];
}

// Hand the ~2 GB of VRAM back when the switch goes off. Best effort, never awaited.
function unload() {
  if (!vlmModel) return;
  fetch(OLLAMA + "/api/generate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: vlmModel, keep_alive: 0 })
  }).catch(() => {});
}

function isVision(m) {
  const fams = (m.details && m.details.families) || [];
  return fams.some(f => /clip|mllama|vision/i.test(f)) ||
         /moondream|llava|bakllava|vision|minicpm-v|qwen2\.?5?-?vl/i.test(m.name || "");
}

// Picks a model, or explains exactly what is missing. Retried while it fails, so
// Ollama can be started (or a model pulled) after the page is already open.
async function findModel() {
  let models;
  try {
    const r = await fetch(OLLAMA + "/api/tags");
    if (!r.ok) throw new Error("HTTP " + r.status);
    models = (await r.json()).models || [];
  } catch (err) {
    setState("absent", "Ollama not detected \u2014 " + OFF);
    return false;
  }
  if (forced) {                              // ?vlm=name trusts the caller completely
    vlmModel = forced;
    setState("ready", narrate ? IDLE : OFF);
    return true;
  }
  const rank = n => { const i = PREFERRED.findIndex(p => n.startsWith(p)); return i < 0 ? 99 : i; };
  const vision = models.filter(isVision).sort((a, b) => rank(a.name) - rank(b.name));
  if (!vision.length) {
    setState("nomodel", "no vision model \u2014 run `ollama pull moondream`");
    return false;
  }
  if (!vision.some(m => m.name === vlmModel)) vlmModel = vision[0].name;
  vlmPick.innerHTML = "";                    // rebuilt from scratch, so retries cannot stack
  for (const m of vision) vlmPick.add(new Option(m.name, m.name));
  vlmPick.value = vlmModel;
  setState("ready", narrate ? IDLE : OFF);
  return true;
}

function promptFor() {
  const best = nnTop[0];
  return best && best[1] >= HINT_MIN
    ? "This is an unfinished doodle of a " + best[0] + ". What does it look like so far?"
    : PROMPT;
}

// Streams one caption. Ollama replies with newline-delimited JSON, one chunk of text
// per line, which is what makes the note type itself out as the model thinks.
async function askModel(b64, prompt) {
  capAbort = new AbortController();
  const res = await fetch(OLLAMA + "/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: vlmModel, prompt, images: [b64], stream: true,
      options: { temperature: 0.2, num_predict: 48 }
    }),
    signal: capAbort.signal
  });
  if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).slice(0, 140));
  sayStreaming("");                          // bare cursor until the first token lands
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", out = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();                       // trailing piece may be half a line
    for (const line of lines) {
      if (!line.trim()) continue;
      let msg;
      try { msg = JSON.parse(line); } catch (e) { continue; }
      if (msg.error) throw new Error(msg.error);
      if (!msg.response) continue;
      out += msg.response;
      // The reply opens with a newline, and `.` does not cross one, so matching the
      // raw text finds no sentence end at all and the note runs on to the token cap.
      // Collapsing first also keeps the note on one flowing line.
      const flat = out.replace(/\s+/g, " ").trim();   // NB: the NDJSON loop owns `line`
      const sentence = flat.match(/^.*?[.!?](\s|$)/);
      sayStreaming(tidy(sentence ? sentence[0] : flat));
      if (sentence) {                        // one line is all the note wants
        reader.cancel().catch(() => {});     // stops the model mid-generation
        return tidy(sentence[0]);
      }
    }
  }
  return tidy(out.replace(/\s+/g, " "));
}

async function captionLoop() {
  for (;;) {
    if (vlmState !== "ready") { await sleep(await findModel() ? 0 : RETRY_MS); continue; }
    if (narrate && strokes.length && fingerprint() !== lastShot) {
      const fp = fingerprint();
      try {
        const text = await askModel(snapshot(), promptFor());
        say(text || "\u2026no comment on that one", !text);   // re-render drops the cursor
        lastShot = fp;
      } catch (err) {
        if (err.name === "AbortError") {           // Clear, or the switch went off
          /* nothing to report */
        } else if (err instanceof TypeError) {     // fetch itself failed: Ollama died
          setState("absent", "Ollama went away \u2014 " + OFF);
        } else {
          say(String(err.message || err), true);
          console.error(err);
          lastShot = fp;                           // do not hammer a broken endpoint
        }
      }
    }
    await sleep(CAPTION_MS);
  }
}

vlmOn.addEventListener("change", () => {
  narrate = vlmOn.checked;
  remember(narrate);
  if (narrate) { lastShot = ""; say(IDLE, true); }   // caption what is already drawn
  else { if (capAbort) capAbort.abort(); say(OFF, true); unload(); }
});

vlmPick.addEventListener("change", () => {
  vlmModel = vlmPick.value; lastShot = ""; setState("ready");
});

// Separate listener so the classifier's own Clear handler stays untouched.
document.getElementById("clear").addEventListener("click", () => {
  if (capAbort) capAbort.abort();
  lastShot = "";
  if (vlmState === "ready") say(narrate ? IDLE : OFF, true);
});

captionLoop();
</script>
</body>
</html>
